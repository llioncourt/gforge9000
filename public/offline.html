<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Universal Character Forge</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #131313; color: #ededed; font-family: system-ui, -apple-system, sans-serif; padding: 24px;
      }
      .card { max-width: 26rem; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.25rem; margin: 20px 0 8px; }
      p { color: #a1a1a1; font-size: 0.9rem; line-height: 1.5; margin: 0 0 20px; }
      button {
        background: #e0a12a; color: #1a1a1a; border: 0; border-radius: 8px;
        padding: 10px 18px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="Universal Character Forge" />
      <h1>You are offline</h1>
      <p>This page needs a connection. Pages you already opened stay available; reconnect to load the rest.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
